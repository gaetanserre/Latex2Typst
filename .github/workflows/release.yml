name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: latex2typst-linux-x86_64
          - os: macos-latest
            artifact: latex2typst-macos-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4

      - name: Install dependencies
        run: opam install -y dune menhir sedlex

      - name: Build
        run: opam exec -- dune build

      - name: Rename binary
        run: cp _build/default/latex2typst.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            latex2typst-linux-x86_64/latex2typst-linux-x86_64
            latex2typst-macos-arm64/latex2typst-macos-arm64
          generate_release_notes: true